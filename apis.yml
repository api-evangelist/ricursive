description: Ricursive (Ricursive Intelligence) is a frontier AI lab building self-improving
  systems, starting with chip design. The company combines modern AI methods with
  semiconductor and electronic design automation (EDA) workflows to create a feedback
  loop between AI systems and the hardware that runs them. It was founded by veterans
  from Google DeepMind, Anthropic, and NVIDIA (including researchers behind AlphaChip)
  and is backed by leading investors. As of this profile Ricursive publishes a public
  marketing and careers site but no public API, SDK, developer documentation, or
  developer product surface — so there is no API artifact to harvest. This company
  profile is maintained in the API Evangelist network for discovery and monitoring.
